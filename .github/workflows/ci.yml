name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 reference, 2026-09-05
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 reference
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[web,dev,team]'
      - run: python -m compileall -q src
      - run: pytest --cov=opentapeout --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - run: python scripts/scan_public_source.py
      - run: python -m build
      - name: Verify synthetic stale-result scenario
        shell: bash
        run: |
          opentapeout demo "$RUNNER_TEMP/stale-demo" --stale
          set +e
          opentapeout --root "$RUNNER_TEMP/stale-demo" gate RC-001 --markdown > "$RUNNER_TEMP/gate.md"
          result=$?
          set -e
          cat "$RUNNER_TEMP/gate.md" >> "$GITHUB_STEP_SUMMARY"
          test "$result" -eq 2
  native-yosys:
    name: real Yosys SAT qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Install real Yosys executable
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends yosys
      - name: Prove miter, invalidate after ECO, reject real counterexample
        run: python scripts/qualify_yosys.py --output yosys-qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yosys-qualification
          path: yosys-qualification.json
          if-no-files-found: error
          retention-days: 30
  native-physical:
    name: real KLayout DRC-LVS and OpenSTA qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Install actual physical verification engines
        run: |
          if ! bash scripts/install_native_tools.sh > "$RUNNER_TEMP/native-build.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/native-build.log"
            exit 1
          fi
          tail -n 15 "$RUNNER_TEMP/native-build.log"
      - name: Execute positive controls, physical defects and missing-constraint regression
        run: python scripts/qualify_physical.py --output physical-qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-qualification
          path: physical-qualification.json
          if-no-files-found: error
          retention-days: 30

  team-https:
    name: signed team review over HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install '.[team]'
      - run: python scripts/qualify_team.py --output team-qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-qualification
          path: team-qualification.json
          if-no-files-found: error
          retention-days: 30
