name: tests
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 reference, 2026-09-05
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 reference
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[web,dev]'
      - run: python -m compileall -q src
      - run: pytest --cov=opentapeout --cov-report=term-missing --cov-report=xml
      - run: python scripts/scan_public_source.py
      - run: python -m build
      - name: Verify synthetic stale-result scenario
        shell: bash
        run: |
          opentapeout demo "$RUNNER_TEMP/stale-demo" --stale
          set +e
          opentapeout --root "$RUNNER_TEMP/stale-demo" gate RC-001 --markdown > "$RUNNER_TEMP/gate.md"
          result=$?
          set -e
          cat "$RUNNER_TEMP/gate.md" >> "$GITHUB_STEP_SUMMARY"
          test "$result" -eq 2
