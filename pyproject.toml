[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentapeout"
version = "0.3.0"
description = "Content-addressed tapeout evidence, dependency-aware freshness, and signed release gates"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "OpenTapeout contributors"}]
keywords = ["eda", "tapeout", "asic", "signoff", "provenance", "release-engineering"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"]
dependencies = ["cryptography>=46.0.4,<50"]

[project.optional-dependencies]
web = ["fastapi>=0.128.2,<1", "uvicorn>=0.40,<1"]
dev = ["pytest>=9,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.12,<1", "build>=1,<2", "jsonschema>=4.23,<5"]

[project.scripts]
opentapeout = "opentapeout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opentapeout = ["static/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
